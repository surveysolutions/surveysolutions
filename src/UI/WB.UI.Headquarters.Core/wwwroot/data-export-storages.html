<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title></title>
    <script type="text/javascript">
        window.onload = function () {

            var qs = getHashQueryString();

            if (qs.state) {
                var state = window.atob(qs.state).split(';');

                var redirectUrl = toSameOriginUrl(decodeURIComponent(state[0]));
                var processingUrl = toSameOriginUrl(decodeURIComponent(state[1]));
                var dataExportState = state[2];

                if (!redirectUrl || !processingUrl) return;

                var xhr = new XMLHttpRequest();

                xhr.open("POST", processingUrl, true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.onreadystatechange = function () {
                    if (xhr.readyState != 4) return;

                    window.location = redirectUrl;
                };
                
                var request ='state=' + encodeURIComponent(dataExportState);
                if(qs.code) request += '&code=' + encodeURIComponent(qs.code);
                else if(qs.access_token) request += '&access_token=' + encodeURIComponent(qs.access_token);
                
                xhr.send(request);
            }
        }

        // Resolves a candidate URL against the current origin and returns a rebuilt
        // same-origin relative path. Returns null for cross-site, javascript: or data: URLs
        // so requests and redirects can never target an attacker-controlled host.
        function toSameOriginUrl(candidate) {
            try {
                var resolved = new URL(candidate, window.location.href);
                if (resolved.origin !== window.location.origin) return null;
                return resolved.pathname + resolved.search + resolved.hash;
            } catch (e) {
                return null;
            }
        }

        function getHashQueryString() {
            var qsObject = Object.create(null);
            var query = window.location.hash;
            if(query === '') query = window.location.search;
            
            var vars = query.substr(1).split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                var key = pair[0];
                if (key === '__proto__' || key === 'constructor' || key === 'prototype') continue;
                qsObject[key] = decodeURIComponent(pair[1]);
            }
            return qsObject;
        }
    </script>
</head>
<body>
<div>Please wait, you will be automatically redirected to the export page of the Survey Solutions Headquarters website.</div>
</body>
</html>
