name: "Copilot issue analysis"
on:
  issues:
    types: [assigned]

permissions:
  issues: write

jobs:
  needs-human:
    if: github.event.assignee.login == 'Copilot' && contains(github.event.issue.labels.*.name, 'copilot:analyze')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "copilot:analyze" --add-label "needs-human"
          gh issue comment "$ISSUE" --repo "$REPO" --body "Copilot is analyzing this issue; questions will be in the linked draft PR. Answer here, then replace \`needs-human\` with \`copilot:ready\` and reassign Copilot (default agent)."
